version: '2'
image: l-docker-klarna-production.artifactory.klarna.net/klarna/node:20.202501201120-builder
include:
  - standardPipeline: node-20-service@4

tasks:
  install:
    stage: install
    var:
      NODE_ENV: development
    command:
      - npm install
  lint:
    stage: quality
    command:
      - npm run lint
  build:
    stage: build
    command:
      - npm run build
  test:
    stage: test
    resources:
      size: extra-large
    var:
      NODE_ENV: test
      NODE_OPTIONS: --max-old-space-size=4096
    docker: true
    command:
      - docker run --rm -d -e POSTGRES_PASSWORD=somethingsecretfortesting -e POSTGRES_USER=gram-test -p 5433:5432 r-docker-docker-hub.artifactory.klarna.net/postgres:12      
      - npm test